name: CI & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build package artifacts
        run: npm run build

      - name: Run vitest suite
        run: npm test

  publish:
    name: Publish to npm (Auto-Bump & Trusted Publishing)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm for Trusted Publishing OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve and bump version
        id: resolve_version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view wikitongues-db version 2>/dev/null || echo "0.0.0")
          echo "Version locale : $LOCAL_VERSION"
          echo "Dernière version npm : $REMOTE_VERSION"

          IS_LOCAL_GREATER=$(node -e "
            const [lMaj, lMin, lPat] = '$LOCAL_VERSION'.split('.').map(Number);
            const [rMaj, rMin, rPat] = '$REMOTE_VERSION'.split('.').map(Number);
            const cmp = (lMaj - rMaj) || (lMin - rMin) || (lPat - rPat);
            console.log(cmp > 0);
          ")

          if [ "$IS_LOCAL_GREATER" = "true" ]; then
            echo "Version locale supérieure ($LOCAL_VERSION > $REMOTE_VERSION) : conservation de la version locale."
          else
            echo "Version locale non incrémentée ($LOCAL_VERSION <= $REMOTE_VERSION)."
            npm version "$REMOTE_VERSION" --no-git-tag-version --allow-same-version
            NEW_VERSION=$(npm version patch --no-git-tag-version)
            echo "Auto-bump patch appliqué à la volée : $NEW_VERSION"
          fi

          FINAL_VERSION=$(node -p "require('./package.json').version")
          echo "Version finale à publier : $FINAL_VERSION"

      - name: Build bundle
        run: npm run build

      - name: Publish package with provenance
        run: npm publish --provenance
